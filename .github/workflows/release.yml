name: Build and publish app release

# Se déclenche à la publication d'une release GitHub :
# build du front → tarball → attaché à la release → poussé sur l'App Store Nextcloud
# (signature via APP_PRIVATE_KEY). Voir dev/README.md pour les secrets requis.

on:
  release:
    types: [published]

env:
  APP_NAME: flowline

permissions:
  contents: write

jobs:
  build_and_publish:
    environment: release
    runs-on: ubuntu-latest
    name: "Release: build, sign and upload the app"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Package app tarball
        run: |
          set -euo pipefail
          mkdir -p build/artifacts/appstore
          rsync -a \
            --exclude='*.map' \
            --include='appinfo/***' --include='lib/***' --include='js/***' \
            --include='css/***' --include='img/***' --include='l10n/***' \
            --include='templates/***' --include='openapi.json' --include='LICENSE' \
            --exclude='*' \
            ./ "build/artifacts/appstore/${APP_NAME}/"
          test -f "build/artifacts/appstore/${APP_NAME}/appinfo/info.xml"
          tar -C build/artifacts/appstore -czf "build/artifacts/appstore/${APP_NAME}.tar.gz" "${APP_NAME}"

      - name: Attach tarball to the GitHub release
        id: attach_to_release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/artifacts/appstore/${{ env.APP_NAME }}.tar.gz
          asset_name: ${{ env.APP_NAME }}.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

      - name: Publish to the Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@ad2020a77eb694e8fe145d2ebd6bc21c246240fd # v1
        with:
          app_name: ${{ env.APP_NAME }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ steps.attach_to_release.outputs.browser_download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: ${{ github.event.release.prerelease }}