name: Build and publish app release

# Se déclenche à la publication d'une release GitHub :
# build du front → tarball → attaché à la release → poussé sur l'App Store Nextcloud
# si les secrets de l'environnement « release » sont posés (APPSTORE_TOKEN +
# APP_PRIVATE_KEY). Sinon le tarball est simplement attaché et la soumission au
# store se fait à la main (URL + signature sha512, clé privée gardée hors GitHub).
# Voir dev/README.md pour les secrets requis.

on:
  release:
    types: [published]

env:
  APP_NAME: flowline

permissions:
  contents: write

jobs:
  build_and_publish:
    environment: release
    runs-on: ubuntu-latest
    name: "Release: build, sign and upload the app"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Package app tarball
        run: |
          set -euo pipefail
          mkdir -p build/artifacts/appstore
          rsync -a \
            --exclude='*.map' \
            --include='appinfo/***' --include='lib/***' --include='js/***' \
            --include='css/***' --include='img/***' --include='l10n/***' \
            --include='templates/***' --include='webclient/***' \
            --include='screenshots/***' \
            --include='openapi.json' --include='LICENSE' --include='CHANGELOG.md' \
            --exclude='*' \
            ./ "build/artifacts/appstore/${APP_NAME}/"
          test -f "build/artifacts/appstore/${APP_NAME}/appinfo/info.xml"
          test -f "build/artifacts/appstore/${APP_NAME}/webclient/index.html"
          tar -C build/artifacts/appstore -czf "build/artifacts/appstore/${APP_NAME}.tar.gz" "${APP_NAME}"

      - name: Attach tarball to the GitHub release
        id: attach_to_release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/artifacts/appstore/${{ env.APP_NAME }}.tar.gz
          asset_name: ${{ env.APP_NAME }}.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

      # Publication store automatique UNIQUEMENT si les secrets sont poses
      # (environnement « release »). Tant qu'ils sont absents, la release GitHub
      # reste publiee (tarball attache) et la soumission au store se fait a la
      # main : URL du tarball + signature sha512 calculee localement.
      - name: Check whether the App Store secrets are configured
        id: store_secrets
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APPSTORE_TOKEN" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets App Store absents — publication store ignoree (soumission manuelle attendue)."
          fi

      - name: Publish to the Nextcloud App Store
        if: steps.store_secrets.outputs.enabled == 'true'
        uses: R0Wi/nextcloud-appstore-push-action@ad2020a77eb694e8fe145d2ebd6bc21c246240fd # v1
        with:
          app_name: ${{ env.APP_NAME }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ steps.attach_to_release.outputs.browser_download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: ${{ github.event.release.prerelease }}

      - name: Remind the manual App Store submission when not automated
        if: steps.store_secrets.outputs.enabled != 'true'
        run: |
          echo "::notice title=App Store::Soumettre la release a la main : https://apps.nextcloud.com/developer/apps/releases/new — URL = ${{ steps.attach_to_release.outputs.browser_download_url }}"
